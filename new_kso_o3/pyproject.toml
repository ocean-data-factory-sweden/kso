[project]
name = "new-kso-o3"
version = "0.1.0"
description = "Modular image ML toolkit with interchangeable back-ends (PyTorch, YOLO, Hugging Face) and flexible storage (local/S3)."
readme = "README.md"
authors = [
  {name = "KSO Team"},
]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "boto3>=1.28",
    "typer[all]>=0.9",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
]

[project.optional-dependencies]
ml = [
  "torch>=1.13; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "torchvision>=0.14; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "mlflow>=2.11",
  "wandb>=0.16",
  "ultralytics>=8.2",
  "transformers[torch]>=4.42",
  "datasets[vision]>=2.19",
  "evaluate>=0.4",
]

dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "moto[s3]>=5",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
python = "3.11"
virtual = "venv"

[tool.hatch.build.targets.wheel]
packages = ["kso"]
