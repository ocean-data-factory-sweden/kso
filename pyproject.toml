[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "kso2"
version = "0.1.0"
description = "A package for managing and training KSO object detection models with MLflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av==15.0.0",
    "black==24.4.2",
    "boto3==1.39.4",
    "config>=0.5.1",
    "databricks-cli>=0.18.0",
    "ffmpeg-python==0.2.0",
    "folium==0.20.0",
    "ftfy==6.3.1",
    "gdown==5.2.0",
    "imagesize==1.4.1",
    "ipyfilechooser==0.6.0",
    "ipywidgets==8.1.7",
    "jupyter-bbox-widget==0.6.0",
    "mlflow>=3.7.0",
    "mlflow-export-import @ git+https://github.com/mlflow/mlflow-export-import.git",
    "natsort==8.4.0",
    "notebook==7.4.4",
    "numpy==2.2.6",
    "opencv-python>=4.11.0.86",
    "pandas==2.3.1",
    "panoptes-client==1.7.1",
    "pims==0.7",
    "pylint==3.3.8",
    "scikit-learn==1.7.2",
    "tabulate>=0.9.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm==4.67.1",
    "ultralytics==8.3.166",
    "wandb==0.21.0",
    "yolov5==7.0.14",
]

[project.optional-dependencies]
dev = [
    "kso2",
    "nbqa==1.9.1",
    "pylint==3.3.8",
    "pytest==8.4.2",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
kso2 = { workspace = true }
