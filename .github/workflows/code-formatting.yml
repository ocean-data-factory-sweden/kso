name: Code formatting

on:
  push:
    branches:
      - master
      - dev
      - kso2-merge
  pull_request:
    branches:
      - master
      - dev
      - kso2-merge

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: psf/black@stable
        with:
          options: "--check --verbose"
          jupyter: true
          version: "~= 24.0"
