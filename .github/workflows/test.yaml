name: CI test 

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ubuntu-latest
        python-version:
          - "3.12"
    name: Test
    runs-on: ${{matrix.os}}

    steps:
      - name: Chechout code
        uses: actions/chechout@v6

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version }}

      - name:  Install dependencies
        run: python -m pip install pytest .

      - name: Run tests
        run: pytest
      


